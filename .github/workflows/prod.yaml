name: Prod CI/CD

on:
    push:
        branches: [ main ]
        paths-ignore:
            - "**/*.md"
    pull_request:
        branches: [ main ]
        paths-ignore:
            - "**/*.md"

concurrency:
    group: lokit-prod-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # main push 가 "develop 을 그대로 merge 한 커밋"이면, 같은 코드로 이미 돌고 있는 develop run 의
    # 테스트 결과와 jar 를 재사용한다(중복 테스트 제거 + prod 에 develop 에서 검증된 jar 그대로 배포).
    # 조건이 하나라도 안 맞으면 dev-run-id 를 비워 두고, 아래 ci job 이 전체 테스트를 돌린다.
    resolve:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        permissions:
            contents: read
            actions: read
        outputs:
            dev-run-id: ${{ steps.find.outputs.dev-run-id }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 2 # merge 커밋의 두 부모까지

            -   name: Find reusable develop run
                id: find
                env:
                    GH_TOKEN: ${{ github.token }}
                shell: bash
                run: |
                    set -uo pipefail

                    P2="$(git rev-parse -q --verify 'HEAD^2' || true)"
                    if [ -z "$P2" ]; then
                        echo "merge 커밋이 아님 → 전체 CI 실행"; exit 0
                    fi

                    # jar 에 들어가는 입력만 비교한다. (infra/, .github/, compose 등 브랜치별 차이는 무시)
                    if ! git diff --quiet "$P2" HEAD -- src build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew; then
                        echo "develop($P2) 대비 빌드 입력이 다름 → 전체 CI 실행"; exit 0
                    fi

                    # develop push 와 main push 가 거의 동시에 일어나므로 run 생성까지 잠시 기다린다.
                    RUN_ID=""
                    for _ in $(seq 1 18); do
                        RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" -w dev.yaml -b develop -e push -c "$P2" -L 1 \
                            --json databaseId -q '.[0].databaseId // empty' 2>/dev/null || true)"
                        [ -n "$RUN_ID" ] && break
                        sleep 5
                    done
                    if [ -z "$RUN_ID" ]; then
                        echo "develop($P2) 의 Dev CI/CD run 을 찾지 못함 → 전체 CI 실행"; exit 0
                    fi
                    echo "develop run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"

                    # 해당 run 의 ci job(테스트 + jar 업로드) 완료까지 대기. 배포 job 은 기다리지 않는다.
                    while :; do
                        STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
                            -q '[.jobs[] | select(.name | startswith("ci"))][0] // {} | "\(.status // "pending") \(.conclusion // "")"' 2>/dev/null || echo "pending ")"
                        read -r STATUS CONCLUSION <<<"$STATE"
                        if [ "$STATUS" = "completed" ]; then
                            if [ "$CONCLUSION" = "success" ]; then
                                # artifact 는 retention 이 지나면 만료된다. 만료/누락이면 재사용할 수 없으므로 전체 CI 로 폴백.
                                JAR_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=app-jar" \
                                    -q '[.artifacts[] | select(.expired | not)] | length' 2>/dev/null || echo 0)"
                                if [ "${JAR_COUNT:-0}" -eq 0 ]; then
                                    echo "develop run 의 app-jar artifact 가 없거나 만료됨 → 전체 CI 실행"; exit 0
                                fi
                                echo "develop ci 성공 → 테스트 생략, jar 재사용"
                                echo "dev-run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
                            else
                                echo "develop ci 결과: $CONCLUSION → 전체 CI 실행"
                            fi
                            exit 0
                        fi
                        sleep 10
                    done

    ci:
        needs: resolve
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.resolve.outputs.dev-run-id == '') }}
        uses: ./.github/workflows/_ci.yaml
        secrets: inherit
        permissions:
            contents: read
            pull-requests: write

    deploy:
        needs: [ resolve, ci ]
        if: >-
            ${{ !cancelled() && github.event_name == 'push' &&
                (needs.ci.result == 'success' ||
                 (needs.ci.result == 'skipped' && needs.resolve.outputs.dev-run-id != '')) }}
        uses: ./.github/workflows/_deploy.yaml
        secrets: inherit
        permissions:
            contents: read
            packages: write
            actions: read
        with:
            environment: prod
            branch: main
            jar-run-id: ${{ needs.resolve.outputs.dev-run-id || github.run_id }}
