name: Dev CI/CD

on:
    push:
        branches: [ develop ]
        paths-ignore:
            - "**/*.md"
    pull_request:
        branches: [ develop ]
        paths-ignore:
            - "**/*.md"

concurrency:
    group: lokit-dev-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # prod.yaml 의 resolve job 이 이 job 이름(ci)으로 develop run 의 테스트 결과를 찾는다. 이름 변경 시 함께 수정.
    ci:
        uses: ./.github/workflows/_ci.yaml
        secrets: inherit
        permissions:
            contents: read
            pull-requests: write

    deploy:
        needs: ci
        if: github.event_name == 'push'
        uses: ./.github/workflows/_deploy.yaml
        secrets: inherit
        permissions:
            contents: read
            packages: write
            actions: read
        with:
            environment: dev
            branch: develop
            jar-run-id: ${{ github.run_id }}
