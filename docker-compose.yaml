services:
    postgres:
        image: postgis/postgis:16-3.4
        restart: unless-stopped
        env_file: .env
        networks:
            - lokit
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
            interval: 10s
            timeout: 5s
            retries: 5
        mem_limit: 768m

    app:
        image: ghcr.io/team-lokit/lokit-api:${APP_IMAGE_TAG:-prod}
        restart: unless-stopped
        env_file: .env
        networks:
            - lokit
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_PORT: "5432"
            TZ: Asia/Seoul
            NEW_RELIC_APP_NAME: lokit-api
            NEW_RELIC_LOG_FILE_NAME: STDOUT
            NEW_RELIC_LOG_LEVEL: info
        volumes:
            - ${APPLE_KEY_HOST_DIR}:/app/secrets:ro
            - ./newrelic/newrelic.yml:/usr/local/newrelic/newrelic.yml:ro
            - ./newrelic/newrelic.jar:/usr/local/newrelic/newrelic.jar:ro
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/actuator/health" ]
            interval: 15s
            timeout: 3s
            retries: 5
            start_period: 60s
        mem_limit: 1280m

    caddy:
        image: caddy:alpine
        restart: unless-stopped
        networks:
            - lokit
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
            - ../caddy/.local/share/caddy:/data/caddy
            - ../caddy/.config/caddy:/config/caddy
        depends_on:
            app:
                condition: service_healthy

volumes:
    postgres_data:
    caddy_data:
    caddy_config:

networks:
    lokit:
        driver: bridge
